<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>규정 길잡이 | 부서 찾기</title>
    <meta http-equiv="refresh" content="0; url=/demo.html" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="brand"><span class="brand-mark">R</span><span>규정 길잡이</span></div>
        <p class="eyebrow">사내 업무 안내 · 테스트 화면</p>
        <h1 id="page-title">어떤 업무를<br />도와드릴까요?</h1>
        <p class="lead">업무 상황을 편하게 입력하면 관련 부서와 확인할 내용을 찾아드릴게요.</p>
        <form id="question-form" class="question-box">
          <label class="sr-only" for="question">업무 상황 입력</label>
          <textarea id="question" rows="2" placeholder="예: 포항 사업장에서 설비를 교체하려는데, 어느 부서와 먼저 협의해야 하나요?"></textarea>
          <button type="submit">찾아보기 <span aria-hidden="true">→</span></button>
        </form>
        <div class="examples" aria-label="예시 질문">
          <button type="button" data-question="포항 사업장에서 설비를 교체하려는데, 어느 부서와 먼저 협의해야 하나요?">설비 교체</button>
          <button type="button" data-question="신규 원료 구매 전 환경과 품질에서 무엇을 확인해야 하나요?">신규 원료 구매</button>
          <button type="button" data-question="투자사업의 설비 구성과 공사 안전을 검토할 부서를 찾아주세요.">투자·공사</button>
        </div>
        <p class="trust">업무분장 기반 초안 · 최종 판단은 담당 부서 검토가 필요합니다.</p>
      </section>
      <section id="answer" class="answer hidden" aria-live="polite">
        <div class="answer-heading"><p class="eyebrow">관련 부서 찾기</p><h2>추천 결과</h2></div>
        <p id="summary" class="summary"></p>
        <div id="clarify" class="clarify hidden"></div>
        <div class="cards"><article id="primary-card" class="department-card primary"></article><div id="partner-cards" class="partner-list"></div></div>
        <p class="disclaimer">테스트 결과는 업무분장 더미 파일에서 추출한 초안 데이터로 생성됩니다. 운영 전 조직 책임자의 검증이 필요합니다.</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
