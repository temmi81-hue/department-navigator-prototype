<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>업무 지침 네비게이터</title><style>
body{margin:0;background:#f6f8fd;color:#071d46;font:16px "Malgun Gothic",Arial}main{max-width:1050px;margin:auto;padding:30px}.box{margin:22px 0;padding:24px;border:1px solid #c8d7ed;border-radius:10px;background:white}h1{font-size:42px}h2{font-size:30px}.hero{max-width:730px;margin:55px auto;text-align:center}.muted,p{color:#596a86;line-height:1.65}textarea,select{box-sizing:border-box;width:100%;margin:7px 0 14px;padding:10px;border:1px solid #c8d7ed;border-radius:6px;font:inherit}textarea{height:100px}.row,.grid{display:grid;grid-template-columns:1fr 1fr auto;gap:12px}.grid{grid-template-columns:2fr 1fr}.primary,.secondary{padding:11px 16px;border-radius:6px;font-weight:bold;cursor:pointer}.primary{border:0;background:#0753c7;color:#fff}.secondary{border:1px solid #c8d7ed;background:#fff;color:#173f78}.summary{padding:14px;border-left:4px solid #0753c7;background:#edf4ff}.card{margin-bottom:12px;padding:19px;border:1px solid #c8d7ed;border-radius:8px}.tag{color:#0753c7;font-weight:bold;font-size:13px}.work{font-size:14px;color:#596a86}.actions{display:flex;gap:10px;margin-top:15px}.draft textarea{height:290px}@media(max-width:700px){main{padding:16px}.row,.grid{grid-template-columns:1fr}}
</style><main><header><b>업무 지침 네비게이터</b> · 업무분장 더미파일 기반 데모</header>
<section id="search" class="hero"><h1>무엇을 도와드릴까요?</h1><p>업무 상황을 입력하면 협의할 부서 후보와 근거를 안내합니다.</p><form id="form" class="box"><textarea id="q" placeholder="예: 수의계약 전에 감사 검토가 필요한지 알고 싶어요."></textarea><div class="row"><select id="site"><option>미선택</option><option>포항</option><option>광양</option><option>세종</option><option>전사</option></select><select id="cat"><option>자동 분류</option><option>안전</option><option>환경</option><option>설비·정비</option><option>구매·자재</option><option>투자·공사</option><option>품질</option><option>컴플라이언스</option><option>재무·회계</option><option>지속가능경영</option><option>인사·노무</option><option>법무·IP</option><option>연구·IP</option><option>경영기획</option></select><button class="primary">부서 찾기</button></div></form></section>
<p id="status" class="muted">데모 데이터를 불러오는 중입니다.</p><section id="result" hidden><button id="back" class="secondary">← 다시 검색</button><div class="summary">검색한 업무 상황<br><b id="sum"></b></div><h2>추천 결과</h2><div id="cards"></div></section>
<section id="confirm" class="box" hidden><b>검토 요청 확인</b><h2>관련 부서에 검토 요청을 할까요?</h2><p id="to"></p><div class="actions"><button id="yes" class="primary">예, 요청 내용 준비</button><button id="no" class="secondary">아니오</button></div></section>
<section id="draft" class="box draft" hidden><b>검토 요청 초안</b><h2>담당 부서에 보낼 내용을 준비하세요</h2><p>더미파일에는 이메일 주소가 없어 수신자는 메일 앱에서 직접 입력합니다.</p><textarea id="mailtext"></textarea><div class="actions"><button id="copy" class="primary">초안 복사</button><button id="mail" class="secondary">메일 초안 열기</button></div></section>
<script>
const $=x=>document.getElementById(x);let orgs=[],main=null,partners=[];
function rank(q,s,c){q=q.toLowerCase();let inferred=/(법인세|세액공제|세무|회계|납부|세무조정|자금|공시|ir|사업보고서|배당)/.test(q)?'재무·회계':/(esg|지속가능|탄소|사회책임|지배구조)/.test(q)?'지속가능경영':/(인사|조직개편|채용|노무|노사|노동|근로|행사)/.test(q)?'인사·노무':/(법무|법률|소송|법률자문|이사회|특허|ip|상표|지식재산)/.test(q)?'법무·IP':/(경영전략|경영계획|사업전략|비전)/.test(q)?'경영기획':/(수의계약|감사|윤리|반부패)/.test(q)?'컴플라이언스':c;return orgs.map(d=>{let n=0,r=[],k=d.keywords.filter(x=>q.includes(x.toLowerCase())),m=d.categories.find(x=>q.includes(x.toLowerCase()));if(inferred!='자동 분류'&&d.categories.includes(inferred)){n+=6;r.push(inferred+' 업무')}else if(m){n+=6;r.push(m+' 업무')}if(s!='미선택'&&(d.sites.includes(s)||d.sites.includes('전사'))){n+=d.sites.includes(s)?5:2;r.push(d.sites.includes(s)?s+' 담당':'전사 담당')}if(k.length){n+=k.length*2;r.push(k.join('·')+' 관련')}return {...d,n,r}}).filter(x=>x.n).sort((a,b)=>b.n-a.n)}
function card(d,co=false){return '<article class="card">'+(co?'<label><input class="co" type="checkbox" value="'+d.id+'"> <span class="tag">협업 후보</span> '+d.name+'</label>':'<span class="tag">주관 후보</span><h2>'+d.name+'</h2>')+'<p>'+d.parent+'</p><p class="work">주요 업무: '+d.responsibility+'</p>'+(co?'':'<button id="request" class="primary">검토 요청 내용 준비</button>')+'</article>'}
function search(){let q=$('q').value.trim();if(!q){$('status').textContent='업무 상황을 입력해 주세요.';return}let a=rank(q,$('site').value,$('cat').value);main=a[0];partners=[];$('sum').textContent=q;$('search').hidden=true;$('result').hidden=false;$('confirm').hidden=true;$('draft').hidden=true;$('cards').innerHTML=a.length?'<div class="grid">'+card(a[0])+'<div><p class="muted">협업 후보</p><p class="muted">(체크하면 주관 후보와 함께 요청 메일 초안에 포함됩니다.)</p>'+a.slice(1,4).map(x=>card(x,true)).join('')+'</div></div>':'<div class="card">일치하는 부서를 찾지 못했습니다.</div>';let b=$('request');if(b)b.onclick=()=>{partners=a.slice(1,4).filter(x=>document.querySelector('.co[value="'+x.id+'"]').checked);$('to').textContent=[main.name,...partners.map(x=>x.name)].join(', ')+'에 사전 협의 내용을 준비합니다.';$('confirm').hidden=false;$('confirm').scrollIntoView({behavior:'smooth'})}}
function draft(){let names=[main.name,...partners.map(x=>x.name)].join(', ');$('mailtext').value='수신: '+names+'\n제목: [사전 협의 요청] '+main.name+' 관련 업무 검토\n\n안녕하세요.\n아래 업무에 대한 사전 검토와 협조를 요청드립니다.\n\n1. 요청 배경\n- '+$('q').value.trim()+'\n\n2. 요청 사항\n- 관련 절차 및 사전 검토 필요 여부를 확인해 주세요.\n- 추가 협의 부서와 준비 자료를 안내해 주세요.\n- 검토 결과와 다음 진행 단계를 회신해 주세요.\n\n3. 업무 정보\n- 사업장: '+$('site').value+'\n- 협업 요청 부서: '+(partners.map(x=>x.name).join(', ')||'없음')+'\n\n감사합니다.';$('confirm').hidden=true;$('draft').hidden=false;$('draft').scrollIntoView({behavior:'smooth'})}
$('form').onsubmit=e=>{e.preventDefault();search()};$('back').onclick=()=>{$('search').hidden=false;$('result').hidden=true;$('confirm').hidden=true;$('draft').hidden=true};$('yes').onclick=draft;$('no').onclick=()=>{$('confirm').hidden=true};$('copy').onclick=()=>navigator.clipboard.writeText($('mailtext').value);$('mail').onclick=()=>location.href='mailto:?subject='+encodeURIComponent('[사전 협의 요청] '+main.name)+'&body='+encodeURIComponent($('mailtext').value);fetch('./pilot_departments.json').then(r=>r.json()).then(x=>{orgs=x.organizations;$('status').textContent='업무분장 더미파일 기준 '+orgs.length+'개 부서를 불러왔습니다.'}).catch(()=>{$('status').textContent='데이터를 불러오지 못했습니다.'});
</script></main></html>
